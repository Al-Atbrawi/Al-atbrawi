$('#si').oninput=e=>{const q=e.target.value;$('#sr').innerHTML=q.trim()?grid(find(q)).replace(/^<div class="grid">|<\/div>$/g,''):''};
$('#sr').onclick=e=>{if(e.target.closest('a'))$('#so').classList.remove('on')};
/* ===== ASSISTANT (local demo; production: POST /api/assistant) ===== */
$('#an').textContent=CONFIG.ASSISTANT_NAME;
const say=(h,c)=>{const m=document.createElement('div');m.className='m '+c;m.innerHTML=h;$('#msgs').append(m);$('#msgs').scrollTop=1e5};
const pc=l=>l.slice(0,3).map(p=>`<div class="mc">${img(p)}<div><b>${p.name}</b><div class="pr">${money(p.price)}</div><a class="btn sm" href="#/product/${p.slug}" style="min-height:34px">عرض المنتج</a> <button class="btn o sm" data-ap="${p.id}" style="min-height:34px">أضف</button></div></div>`).join('');
function ask(t){say(esc(t),'u');const q=norm(t),pn=(t.match(/\d+/)||[])[0];let r;
if(/فرع|فروع|وين|اين|عنوان/.test(q)&&!/عطر|منتج/.test(q))r='📍 '+CONFIG.BRANCHES.map(b=>b.name+'\n<a href="'+mapUrl(b)+'" target="_blank" rel="noopener"><u>'+b.addr+'</u></a>').join('\n\n📍 ');
else if(/كيف.*اطلب|الطلب|اطلب/.test(q)&&!pn)r='1. اختر المنتجات.\n2. أضفها إلى السلة.\n3. أدخل بياناتك.\n4. اضغط «تأكيد الطلب».\n5. سيتم استلام الطلب والتواصل معك لتأكيد التفاصيل.';
else if(/عروض|خصم/.test(q))r='تجد العروض هنا: <a href="#/offers"><u>صفحة العروض</u></a>';
else if(/استرجاع|استبدال/.test(q))r='تجد التفاصيل هنا: <a href="#/returns"><u>الاستبدال والاسترجاع</u></a>';
else if(/تواصل|هاتف|واتساب|رقم/.test(q))r='الهاتف: '+CONFIG.STORE_PHONE+'\nواتساب: '+CONFIG.WHATSAPP_DISPLAY+'\n<a href="#/contact"><u>صفحة التواصل</u></a>';
else if(/توصيل|شحن/.test(q))r='يتم تأكيد تكلفة التوصيل مع العميل بعد إرسال الطلب.';
else{let l=[];const kw=q.split(/\s+/).filter(w=>w.length>2&&!/اريد|عايز|ابحث|عن|ساعدني|في|حدود|جنيه/.test(w));kw.forEach(w=>find(w).forEach(p=>!l.includes(p)&&l.push(p)));
if(/عطر/.test(q)&&!l.length)l=PRODUCTS.filter(p=>p.cat==='perfumes');if(/سودان/.test(q))l=PRODUCTS.filter(p=>p.cat==='sudanese-products');
if(pn)l=l.filter(p=>p.price<=+pn);
if(l.length)r='يسعدني ترشيح هذه المنتجات من الكتالوج الحالي:'+pc(l);
else if(/هدي/.test(q))r='يسعدني مساعدتك. هل تفضل عطرًا نسائيًا، أم منتجًا من منتجات العناية والجمال؟';
else if(/عطر|اختيار|ساعد/.test(q))r='بكل سرور. هل تفضل رائحة شرقية دافئة، أم رائحة أكثر هدوءًا وانتعاشًا؟';
else r='لا أملك هذه المعلومة حاليًا، ويمكنك التواصل مع فريق العطبراوي للتأكد منها.'}
setTimeout(()=>say(r,'b'),450)}
$('#chips').innerHTML=['ساعدني في اختيار عطر','ما المنتجات السودانية؟','أين فروعكم؟','كيف أطلب؟','أريد هدية'].map(c=>`<button type="button">${c}</button>`).join('');
$('#chips').onclick=e=>{if(e.target.tagName==='BUTTON')ask(e.target.textContent)};
$('#cf').onsubmit=e=>{e.preventDefault();const v=$('#ci').value.trim();if(v){$('#ci').value='';ask(v)}};
$('#ai').onclick=()=>{$('#chat').classList.toggle('on');if(!$('#msgs').children.length)say('مرحبًا بك في '+CONFIG.STORE_NAME+'. أنا '+CONFIG.ASSISTANT_NAME+'، يسعدني مساعدتك في اختيار ما يناسبك.','b')};$('#cx').onclick=()=>$('#chat').classList.remove('on');
document.querySelectorAll('[data-logo]').forEach(i=>i.src=IMG.logo);{const l=document.createElement('link');l.rel='icon';l.href=IMG.logo;document.head.append(l)}
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
render();
</script>
</body>
</html>
